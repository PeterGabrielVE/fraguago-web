services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: fraguago-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Necesario para hot reload con volúmenes montados en Windows/macOS
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next-dev
